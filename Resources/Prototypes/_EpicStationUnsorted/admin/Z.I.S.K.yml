- type: entity
  id: TFB
  parent: MobShadowkin
  name: The Future Barony
  components:
  - type: LanguageKnowledge # Einstein Engines - Languages
    speaks:
    - TauCetiBasic
    - RobotTalk
    understands:
    - TauCetiBasic
    - RobotTalk
  - type: HarpySinger
#    ShutUpDamageThreshold: 5 # Punch does 5 damage #OmuStation, "gotta have my combat music"
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
    program: 52
  - type: SwappableInstrument
